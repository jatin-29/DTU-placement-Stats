name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # Hourly: refresh the offline copy of the live Google Sheet that ships with the site.
    # (Visitors always read the sheet directly; this is only the fallback.)
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Refresh snapshot of the live Google Sheet
        run: node scripts/fetch-sheet.mjs || echo "::warning::Could not read the Google Sheet; deploying the committed snapshot"

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      # Company logos are downloaded once and kept between runs.
      - name: Restore logo cache
        uses: actions/cache@v4
        with:
          path: .logo-cache
          key: logos-${{ github.run_id }}
          restore-keys: logos-

      - name: Bundle company logos
        run: node scripts/fetch-logos.mjs _site .logo-cache || echo "::warning::Could not bundle logos; the site falls back to favicon services"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only the default branch publishes (scheduled runs always use it).
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
