name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # Every 15 minutes: refresh the 2028 internship data and the offline copy
    # of the live Google Sheet (visitors read the sheet directly; that copy is
    # only the fallback).
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Refresh snapshot of the live Google Sheet
        run: node scripts/fetch-sheet.mjs || echo "::warning::Could not read the Google Sheet; deploying the committed snapshot"

      - name: Refresh 2028 internship selections
        run: node scripts/fetch-2028.mjs || echo "::warning::Could not refresh the 2028 data; deploying the committed copy"

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
          # Version every script and stylesheet URL, so browsers (phones
          # especially) load new code right after a deploy, not a cached copy.
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(assets/js/app\.js|assets/css/styles\.css)\"#\1?v=$V\"#g" _site/index.html
          find _site/assets/js -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^']+\.js)'#\1?v=$V'#g" {} +

      # Company logos are downloaded once and kept between runs.
      - name: Restore logo cache
        uses: actions/cache@v4
        with:
          path: .logo-cache
          key: logos-${{ github.run_id }}
          restore-keys: logos-

      - name: Bundle company logos
        run: node scripts/fetch-logos.mjs _site .logo-cache || echo "::warning::Could not bundle logos; the site falls back to favicon services"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only the default branch publishes (scheduled runs always use it).
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
